services:
  postgres:
    image: postgres:16
    container_name: lucidflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lucidflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-lucidflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lucidflow} -d ${POSTGRES_DB:-lucidflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
