[project]
name = "lucidflow"
version = "0.1.0"
description = "ML-driven data quality platform — Phases 1-4 done (ETL spine, three trained models, MLOps layer); Phase 5 dashboard in progress"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyarrow>=14.0",
    "mlflow>=2.14",
    "prefect>=3.0",
    "boto3>=1.34",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
